debug: false
server:
    port: ${SERVICE_PORT:8182}
    shutdown: graceful
spring:
    application:
        name: appointment-service
    lifecycle:
        timeout-per-shutdown-phase: 30s
    main:
        allow-bean-definition-overriding: false
    output:
        ansi:
            enabled: always
    graphql:
        graphiql:
            enabled: true
    datasource:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://${DBHOST:localhost}:${DBPORT:5432}/${DBNAME:appointment_db}
        username: ${DBUSER:apsportal}
        password: ${DBPASS:apsportal}

management:
    endpoints:
        web:
            exposure:
                include: health
    endpoint:
        health:
            probes:
                enabled: true

logging:
    pattern:
        console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){cyan} - %clr(%-5level){yellow} %clr(%logger{36}){green} - %msg%n"
    level:
        org.jooq: DEBUG
        org.springframework: INFO
        by.anatolyloyko: DEBUG
        org.zalando.logbook.Logbook: TRACE
    file:
        name: log/appointment-service.log
