apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-realm
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "default.labels" . | indent 4 }}
  annotations:
    {{- include "default.configmap.annotations" . | indent 4 }}
data:
  ams-realm.json: |-
    {{ .Files.Get .Values.keycloak.realm.file.path | nindent 4 }}