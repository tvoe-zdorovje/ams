apiVersion: v2
name: grafana-lgtm
description: An umbrella Helm chart for deploying monitoring infrastructure based on Grafana LGTM stack (not distributed)
type: application
version: 0.1.0

dependencies:
  - name: grafana
    alias: grafana
    condition: grafana.enabled
    repository: "oci://ghcr.io/grafana-community/helm-charts"
    version: "^14.0.0"
  - name: loki
    alias: loki
    condition: loki.enabled
    repository: "oci://ghcr.io/grafana-community/helm-charts"
    version: "^18.17.0"
  - name: mimir-distributed
    alias: mimir
    condition: mimir.enabled
    repository: "oci://ghcr.io/grafana/helm-charts"
    version: "^6.2.0"
  - name: tempo
    alias: tempo
    condition: tempo.enabled
    repository: "oci://ghcr.io/grafana-community/helm-charts"
    version: "^3.2.0"
  - name: alloy
    alias: alloy
    condition: alloy.enabled
    repository: "https://grafana.github.io/helm-charts"
    version: "^1.4.0"
  - name: prometheus-postgres-exporter
    alias: pg-exporter
    condition: pg-exporter.enabled
    repository: "https://prometheus-community.github.io/helm-charts"
    version: "^8.2.0"
