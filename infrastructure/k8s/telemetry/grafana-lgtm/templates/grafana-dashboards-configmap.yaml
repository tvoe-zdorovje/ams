apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-dashboards-cm
  annotations:
    deploymentTime: {{ now }}
  labels:
    {{ .Values.grafana.sidecar.dashboards.label }}: {{ .Values.grafana.sidecar.dashboards.labelValue | quote }}
data:
  {{- range $path, $_ := .Files.Glob "files/grafana-dashboards/*.json" }}

  {{ base $path }}: |-
{{ $.Files.Get $path | trim | indent 4 }}

    {{- end }}