grafana:
  enabled: true

  adminUser: "admin"
  adminPassword: "admin"
#  admin:
#    existingSecret:

  ingress:
    enabled: true
    hosts:
      - grafana.ams.by
  resources:
    requests:
      cpu: 250m
      memory: 750Mi
    limits:
      cpu: 500m
      memory: 1Gi

  grafana.ini:
    analytics:
      reporting_enabled: false

