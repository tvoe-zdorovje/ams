apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-router-config-pvc
spec:
  accessModes:
    - {{ .Values.service.persistence.accessModes }}
  resources:
    requests:
      storage: {{ .Values.service.persistence.storage }}
  volumeName: {{ .Release.Name }}-router-config-pv
  storageClassName: {{ .Values.service.persistence.storageClass }}
