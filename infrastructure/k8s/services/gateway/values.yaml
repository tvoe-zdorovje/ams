service:
  image:
    repository: "ghcr.io/tvoe-zdorovje/ams/gateway"
    tag: ""
    pullPolicy: IfNotPresent
    pullSecrets:
      - name: github-registry

  deployment:
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 333Mi
      limits:
        memory: 333Mi

    livenessProbe:
      httpGet:
        path: "/health?live"
        port: 8080

    readinessProbe:
      httpGet:
        path: "/health?ready"
        port: 8080

  service:
    type: ClusterIP
    ports:
      - port: 80
        targetPort: 8080
        protocol: TCP

  persistence:
    accessModes: ReadWriteOnce
    storage: 32Mi
    path: /mnt/schemas
    storageClass: manual

  volumes:
    - name: serivce-schema-storage
      mountPath: /tmp/app/schemas/service
      claimName: gateway-schemas-pvc # prefix: .Release.Name
    - name: schema-storage
      mountPath: /tmp/app/schemas
    - name: config-rover
      mountPath: /.config/rover

  ingress:
    host: ams.by
    path: /.*
    port: 80
    pathType: ImplementationSpecific

  cm:
    env:
    JWKS_URL: "http://auth-service:8080/.well-known/jwks"
    # in minutes
    JWKS_REFRESH_INTERVAL: 30
    # proxy
    LISTEN_ADDR: ":8080"
    BACKEND_TARGET: "http://localhost:4000"
    
    AUTH_SERVICE_HOST: "http://auth-service:8180/graphql"
    ADMINISTRATION_SERVICE_HOST: "http://administration-service:8181/graphql"
    APPOINTMENTS_SERVICE_HOST: "http://appointment-service:8182/graphql"
    BRANDS_SERVICE_HOST: "http://brand-service:8183/graphql"
    STUDIOS_SERVICE_HOST: "http://studio-service:8184/graphql"
    USERS_SERVICE_HOST: "http://user-service:8185/graphql"
