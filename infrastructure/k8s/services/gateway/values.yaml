service:
  image:
    repository: "ghcr.io/tvoe-zdorovje/ams/gateway"
    tag: ""
    pullPolicy: IfNotPresent
    pullSecrets:
      - name: github-registry

  deployment:
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 333Mi
      limits:
        memory: 333Mi

    livenessProbe:
      httpGet:
        path: "/health?live"
        port: 8080

    readinessProbe:
      httpGet:
        path: "/health?ready"
        port: 8080

  service:
    type: ClusterIP
    ports:
      - port: 80
        targetPort: 8080
        protocol: TCP
        name: proxy
      - port: 4000 # dev only
        targetPort: 4000
        protocol: TCP
        name: router

  persistence:
    accessModes: ReadOnlyMany
    storage: 4Mi
    path: /gateway/build
    storageClass: manual

  volumes:
    - name: config-volume
      mountPath: /dist/mnt
      claimName: gateway-config-pvc # prefix: .Release.Name

  ingress:
    host: ams.by
    path: /.*
    port: 80
    pathType: ImplementationSpecific

  cm:
    env:
      APOLLO_ROUTER_HOT_RELOAD: true
      APOLLO_ROUTER_INCLUDE_SUBGRAPH_ERRORS: true
      APOLLO_ROUTER_SUPERGRAPH_PATH: /dist/mnt/schema/supergraph.graphql
      APOLLO_ROUTER_CONFIG_PATH: /dist/mnt/config/router.yaml
      APOLLO_ROUTER_LISTEN_ADDRESS: 127.0.0.1:4000
      APOLLO_ROUTER_HEALTH_CHECK_LISTEN_ADDRESS: 127.0.0.1:4000

      JWKS_URL: "http://auth-service:8080/.well-known/jwks"
      # in minutes
      JWKS_REFRESH_INTERVAL: 30
      # proxy
      LISTEN_ADDR: ":8080"
      BACKEND_TARGET: "http://localhost:4000"

      AUTH_SERVICE_HOST: "http://auth-service:8080/graphql"
      ADMINISTRATION_SERVICE_HOST: "http://administration-service:8080/graphql"
      APPOINTMENTS_SERVICE_HOST: "http://appointment-service:8080/graphql"
      BRANDS_SERVICE_HOST: "http://brand-service:8080/graphql"
      STUDIOS_SERVICE_HOST: "http://studio-service:8080/graphql"
      USERS_SERVICE_HOST: "http://user-service:8080/graphql"
