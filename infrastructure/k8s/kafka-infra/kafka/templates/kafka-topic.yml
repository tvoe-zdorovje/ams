{{- range .Values.topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ .name | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "default.labels" $ | indent 4 }}
    strimzi.io/cluster: {{ $.Release.Name }}
  annotations:
    {{- include "default.annotations" $ | indent 4 }}
spec:
  partitions: {{ .partitions }}
  replicas: {{ .replicas }}
  {{- with .config }}
  config:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
