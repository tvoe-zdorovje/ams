apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "default.labels" . | nindent 4 }}
  annotations:
    {{- include "default.annotations" . | nindent 4 }}
spec:
  type: {{ .Values.schemaRegistry.service.type }}
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.schemaRegistry.service.port }}
      targetPort: http
      protocol: TCP
