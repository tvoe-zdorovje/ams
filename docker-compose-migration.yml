      - update

  liquibase_user_db:
    image: liquibase/liquibase:latest-alpine
    container_name: liquibase_user_db
    restart: on-failure
    env_file:
      - user-service/.env
    depends_on:
      user_db:
        condition: service_healthy
    volumes:
      - ./user-service/database/changelog:/liquibase/changelog
    command:
      - update
