spring:
  application:
    name: appointment-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DBHOST}:${DBPORT}/${DBNAME}
    username: ${DBUSER}
    password: ${DBPASS}
