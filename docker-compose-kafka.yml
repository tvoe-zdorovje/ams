services:
  kafka:
    image: confluentinc/cp-kafka:8.0.3
    hostname: kafka
    container_name: kafka
    restart: on-failure
    ports:
      - "9092:9092"
    environment: # temporary here
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_LOG_DIRS: '/var/lib/kafka/data/log'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      CLUSTER_ID: 'qtYbt-BeTuCoNnuqDxqY6Q'
    healthcheck:
      test: [ "CMD-SHELL", "kafka-cluster cluster-id --bootstrap-server kafka:29092" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - kafka-volume:/var/lib/kafka/data

  kafka-connect:
    image: ams/kafka-connect:8.0.3-debezium-3.4.1
    build:
      context: .
      dockerfile: infrastructure/kafka/connect/Dockerfile
      args:
        DEBEZIUM_VERSION: 3.4.1.Final
    hostname: kafka-connect
    container_name: kafka-connect
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      liquibase_user_db:
        condition: service_completed_successfully
      liquibase_brand_db:
        condition: service_completed_successfully
      liquibase_studio_db:
        condition: service_completed_successfully
    ports:
      - "9083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'kafka:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: kafka-connect-group
      CONNECT_TOPIC_CREATION_ENABLE: "true"
      CONNECT_TOPIC_PARTITIONS: 3
      CONNECT_TOPIC_REPLICATION_FACTOR: 1
      CONNECT_CONFIG_STORAGE_TOPIC: kafka-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_TOPIC: kafka-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: kafka-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER_AUTO_REGISTER_SCHEMAS: "true"
      CONNECT_PUBLICATION_AUTOCREATE_MODE: "disabled"
      CONNECT_SLOT_AUTOCREATE: "true"
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_SNAPSHOT_MODE: "never"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8083/connector-plugins" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  schema-registry:
    image: confluentinc/cp-schema-registry:8.0.3
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8081'
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/subjects" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kafka-volume:
    driver: local
