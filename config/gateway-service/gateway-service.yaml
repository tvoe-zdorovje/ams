server:
  netty:
    connection-timeout: 3s
    idle-timeout: 20s
spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI}
  data:
    redis:
      connect-timeout: 3s
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 3s
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s
      default-filters:
        - StripPrefix=1
        #             Cannot be used: there are no ways to determine whether the operation is idempotent
        #                 since all services are configured to use POST method for both mutations and queries
        #            - name: Retry
        - name: RequestRateLimiter
          args:
            redis-rate-limiter:
              replenishRate: 10
              burstCapacity: 20
              requestedTokens: 1
      routes:
        - id: auth-service-route
          uri: ${AUTH_SERVICE_HOST}
          predicates:
            - Path=/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
        - id: administration-service-route
          uri: ${ADMINISTRATION_SERVICE_HOST}
          predicates:
            - Path=/administration/**
          filters:
            - name: CircuitBreaker
              args:
                name: administrationServiceCircuitBreaker
        - id: appointment-service-route
          uri: ${APPOINTMENT_SERVICE_HOST}
          predicates:
            - Path=/appointment/**
          filters:
            - name: CircuitBreaker
              args:
                name: appointmentServiceCircuitBreaker
        - id: brand-service-route
          uri: ${BRAND_SERVICE_HOST}
          predicates:
            - Path=/brand/**
          filters:
            - name: CircuitBreaker
              args:
                name: brandServiceCircuitBreaker
        - id: studio-service-route
          uri: ${STUDIO_SERVICE_HOST}
          predicates:
            - Path=/studio/**
          filters:
            - name: CircuitBreaker
              args:
                name: studioServiceCircuitBreaker
        - id: user-service-route
          uri: ${USER_SERVICE_HOST}
          predicates:
            - Path=/user/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: time_based
        sliding-window-size: 30
        failure-rate-threshold: 60
        permitted-number-of-calls-in-half-open-state: 5
        wait-duration-in-open-state: 10s
        slow-call-duration-threshold: 5s
        minimum-number-of-calls: 15
    instances:
      administrationServiceCircuitBreaker:
        base-config: default
      appointmentServiceCircuitBreaker:
        base-config: default
      authServiceCircuitBreaker:
        base-config: default
      brandServiceCircuitBreaker:
        base-config: default
      studioAggregateServiceCircuitBreaker:
        base-config: default
      userAggregateServiceCircuitBreaker:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: TRACE
