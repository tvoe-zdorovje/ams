server:
  port: ${GATEWAY_SERVICE_PORT:4000}
  shutdown: graceful
  netty:
    connection-timeout: 3s
    idle-timeout: 20s
spring:
  application:
    name: gateway-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s
      default-filters:
        - RewritePath=/(?<service>[^/]+)/(?<remaining>.*), /${remaining}
#             Cannot be used: there are no ways to determine whether the operation is idempotent
#                 since all services are configured to use POST method for both mutations and queries
#            - name: Retry
#             TODO https://javaops.ru/view/cloudjava/gateway_service_1/filter
#            - name: RequestRateLimiter
#              args:
#                redis-rate-limiter:
#                  replenishRate: 10
#                  burstCapacity: 20
#                  requestedTokens: 1
      routes:
        - id: administration-service-route
          uri: ${ADMINISTRATION_SERVICE_HOST:http://administration-service:8080}
          predicates:
            - Path=/administration/**
          filters:
            - name: CircuitBreaker
              args:
                name: administrationServiceCircuitBreaker
        - id: appointment-service-route
          uri: ${APPOINTMENTS_SERVICE_HOST:http://appointment-service:8080}
          predicates:
            - Path=/appointment/**
          filters:
            - name: CircuitBreaker
              args:
                name: appointmentServiceCircuitBreaker
        - id: auth-service-route
          uri: ${AUTH_SERVICE_HOST:http://auth-service:8080}
          predicates:
            - Path=/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
        - id: brand-service-route
          uri: ${BRANDS_SERVICE_HOST:http://brand-service:8080}
          predicates:
            - Path=/brand/**
          filters:
            - name: CircuitBreaker
              args:
                name: brandServiceCircuitBreaker
        - id: studio-service-route
          uri: ${STUDIOS_SERVICE_HOST:http://studio-service:8080}
          predicates:
            - Path=/studio/**
          filters:
            - name: CircuitBreaker
              args:
                name: studioServiceCircuitBreaker
        - id: user-service-route
          uri: ${USERS_SERVICE_HOST:http://user-service:8080}
          predicates:
            - Path=/user/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: time_based
        sliding-window-size: 30
        failure-rate-threshold: 60
        permitted-number-of-calls-in-half-open-state: 5
        wait-duration-in-open-state: 10s
        slow-call-duration-threshold: 5s
        minimum-number-of-calls: 15
    instances:
      administrationServiceCircuitBreaker:
        base-config: default
      appointmentServiceCircuitBreaker:
        base-config: default
      authServiceCircuitBreaker:
        base-config: default
      brandServiceCircuitBreaker:
        base-config: default
      studioAggregateServiceCircuitBreaker:
        base-config: default
      userAggregateServiceCircuitBreaker:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
