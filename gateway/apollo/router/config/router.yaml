# Configuration of the router's HTTP server
# Default configuration for container
supergraph:
  # The socket address and port to listen on
  listen: ${env.APOLLO_ROUTER_LISTEN_ADDRESS:-0.0.0.0:4000}

health_check:
  listen: ${env.APOLLO_ROUTER_HEALTH_CHECK_LISTEN_ADDRESS:-0.0.0.0:8088}
  path: /health
  enabled: true

headers:
  all:
    request:
      - propagate:
          named: "Authorization"

override_subgraph_url:
  auth: ${env.AUTH_SERVICE_SUBGRAPH}
  administration: ${env.ADMINISTRATION_SERVICE_SUBGRAPH}
  appointments: ${env.APPOINTMENT_SERVICE_SUBGRAPH}
  brands: ${env.BRAND_SERVICE_SUBGRAPH}
  studios: ${env.STUDIO_SERVICE_SUBGRAPH}
  users: ${env.USER_SERVICE_SUBGRAPH}

include_subgraph_errors:
  all: ${env.APOLLO_ROUTER_INCLUDE_SUBGRAPH_ERRORS:-false}

