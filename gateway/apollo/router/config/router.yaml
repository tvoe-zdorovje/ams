# Configuration of the router's HTTP server
# Default configuration for container
supergraph:
  # The socket address and port to listen on
  listen: ${env.APOLLO_ROUTER_LISTEN_ADDRESS:-0.0.0.0:4000}

health_check:
  listen: ${env.APOLLO_ROUTER_HEALTH_CHECK_LISTEN_ADDRESS:-0.0.0.0:8088l}
  path: /health
  enabled: true

headers:
  all:
    request:
      - propagate:
          named: "Authorization"

override_subgraph_url:
  administration: ${env.ADMINISTRATION_SERVICE_HOST:-http://administration-service:8080/graphql} 
  appointments: ${env.APPOINTMENTS_SERVICE_HOST:-http://appointment-service:8080/graphql}
  auth: ${env.AUTH_SERVICE_HOST:-http://auth-service:8080/graphql}
  brands: ${env.BRANDS_SERVICE_HOST:-http://brand-service:8080/graphql}
  studios: ${env.STUDIOS_SERVICE_HOST:-http://studio-service:8080/graphql}
  users: ${env.USERS_SERVICE_HOST:-http://user-service:8080/graphql}

include_subgraph_errors:
  all: ${env.APOLLO_ROUTER_INCLUDE_SUBGRAPH_ERRORS:-false}

