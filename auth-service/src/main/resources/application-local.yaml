debug: false
server:
  port: 8180
  shutdown: graceful
spring:
  cloud:
    config:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    allow-bean-definition-overriding: false
  output:
    ansi:
      enabled: always
  datasource:
    user-db:
      driver-class-name: org.postgresql.Driver
      jdbcUrl: jdbc:postgresql://localhost:5445/user_db
      username: ausportal
      password: ausportal
    administration-db:
      driver-class-name: org.postgresql.Driver
      jdbcUrl: jdbc:postgresql://localhost:5441/administration_db
      username: ausportal
      password: ausportal
  data:
    redis:
      connect-timeout: 3s
      host: localhost
      port: 6379
      timeout: 3s
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: auth-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      enable-auto-commit: false
    listener:
      ack-mode: manual
      missing-topics-fatal: false

ams:
  redis:
    topic:
      user-tokens:
        key-prefix: "auth:token:userID:"
  kafka:
    topic:
      keycloak-events:
        name: v1.keycloak.events
    props:
      nack-cooldown: 100ms

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  time-of-life: 300000 # 5 minutes
  algorithm: RS256
  private-key:
    kid-format: "kid-%d"
    rotation:
      vault-size: 2
      period: 3600000 # 60 minutes

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){cyan} - %clr(%-5level){yellow} %clr(%logger{36}){green} - %msg%n"
  level:
    org.jooq: DEBUG
    org.springframework: INFO
    by.anatolyloyko: DEBUG
    org.zalando.logbook.Logbook: TRACE
  file:
    name: log/auth-service.log
