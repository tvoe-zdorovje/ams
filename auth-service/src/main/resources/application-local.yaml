debug: false
server:
  port: 8180
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    allow-bean-definition-overriding: false
  output:
    ansi:
      enabled: always
  graphql:
    graphiql:
      enabled: true
  datasource:
    user-db:
      driver-class-name: org.postgresql.Driver
      jdbcUrl: jdbc:postgresql://localhost:5445/user_db
      username: ausportal
      password: ausportal
    administration-db:
      driver-class-name: org.postgresql.Driver
      jdbcUrl: jdbc:postgresql://localhost:5441/administration_db
      username: ausportal
      password: ausportal

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  time-of-life: 300000 # 5 minutes
  algorithm: RS256
  private-key:
    kid-format: "kid-%d"
    rotation:
      vault-size: 2
      period: 3600000 # 60 minutes

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){cyan} - %clr(%-5level){yellow} %clr(%logger{36}){green} - %msg%n"
  level:
    org.jooq: DEBUG
    org.springframework: INFO
    by.anatolyloyko: DEBUG
    org.zalando.logbook.Logbook: TRACE
  file:
    name: log/auth-service.log
